spring.application.name=payment-search
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://ep-soft-shadow-b57phmcb-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require&channelBinding=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
